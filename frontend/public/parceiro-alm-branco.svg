<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70" role="img" aria-label="ALM Steel">
  <!-- Tratamento de mural de logos: silhueta branca, para ficar legivel sobre
       o fundo escuro e consistente com os outros parceiros. O predio virou
       contorno para as janelas nao sumirem no preenchimento. -->
  <g transform="translate(8, 8)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="22,1.5 42.5,14.5 42.5,48.5 1.5,48.5 1.5,14.5" />
  </g>
  <g transform="translate(8, 8)" fill="#fff">
    <rect x="17" y="30" width="10" height="18.5" />
    <rect x="6" y="23" width="6" height="6" />
    <rect x="32" y="23" width="6" height="6" />
    <rect x="6" y="34" width="6" height="6" />
    <rect x="32" y="34" width="6" height="6" />
  </g>
  <text x="62" y="28" font-family="'Outfit', Arial, sans-serif" font-weight="800" font-size="18" fill="#fff" letter-spacing="1">ALM STEEL</text>
  <g font-family="'Outfit', Arial, sans-serif" font-size="6.5" fill="#fff" fill-opacity="0.75" letter-spacing="1.5">
    <text x="62" y="40">ESTRUTURAS METÁLICAS</text>
    <text x="62" y="50">ALPINISMO INDUSTRIAL</text>
    <text x="62" y="60">LINHAS DE VIDA</text>
  </g>
</svg>
